<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — TaskFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">TF</span>
        <span class="brand-name">TaskFlow</span>
      </div>

      <h1>Create your account</h1>
      <p class="subtitle">Start organizing your daily work in a clean blue-and-white workspace.</p>

      {% if error %}
      <div class="alert-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('register') }}" class="auth-form">
        <div class="form-group">
          <label for="full_name">Full name</label>
          <input id="full_name" name="full_name" type="text" required minlength="2" placeholder="Alex Morgan" />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters" />
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6" placeholder="Re-enter password" />
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="{{ url_for('login') }}">Sign in</a>
      </p>
    </section>
  </main>
</body>
</html>
