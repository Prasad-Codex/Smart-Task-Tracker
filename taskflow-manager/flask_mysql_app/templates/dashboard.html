<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — TaskFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="dashboard-page" data-today="{{ today_date }}">
  <div class="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">TF</span>
          <span class="brand-name">TaskFlow</span>
        </div>
        <button type="button" class="icon-btn mobile-only" id="close-menu-btn" aria-label="Close menu">&times;</button>
      </div>

      <nav class="sidebar-nav" aria-label="Task filters">
        <button type="button" class="nav-btn active" data-filter="all">All Tasks</button>
        <button type="button" class="nav-btn" data-filter="today">Today's Tasks</button>
        <button type="button" class="nav-btn" data-filter="Pending">Pending</button>
        <button type="button" class="nav-btn" data-filter="In Progress">In Progress</button>
        <button type="button" class="nav-btn" data-filter="Completed">Completed</button>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <p class="user-name">{{ user_name }}</p>
          <p class="user-email">{{ user_email }}</p>
        </div>
        <a href="{{ url_for('logout') }}" class="btn btn-outline btn-full">Sign Out</a>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn mobile-only" id="open-menu-btn" aria-label="Open menu">&#9776;</button>
          <div>
            <p class="breadcrumb">Workspace / Overview</p>
            <h1 id="view-title">All Tasks</h1>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="new-task-btn">+ New Task</button>
      </header>

      <main class="content">
        <!-- Dashboard Summary Stats -->
        <section class="stats-grid" aria-label="Task summary">
          <div class="stat-box">
            <span class="stat-label">Total Tasks</span>
            <strong class="stat-value" id="stat-total">0</strong>
          </div>
          <div class="stat-box">
            <span class="stat-label">Pending Tasks</span>
            <strong class="stat-value text-amber" id="stat-pending">0</strong>
          </div>
          <div class="stat-box">
            <span class="stat-label">Completed Tasks</span>
            <strong class="stat-value text-green" id="stat-completed">0</strong>
          </div>
          <div class="stat-box">
            <span class="stat-label">Today's Tasks</span>
            <strong class="stat-value text-blue" id="stat-today">0</strong>
          </div>
        </section>

        <!-- Search and Filter Controls -->
        <section class="toolbar">
          <input type="search" id="search-input" class="search-input" placeholder="Search tasks..." aria-label="Search tasks" />
          <select id="priority-filter" class="select-input" aria-label="Filter by priority">
            <option value="all">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
        </section>

        <div id="feedback-banner" class="alert-error hidden" role="alert"></div>

        <!-- Task Cards Container -->
        <section id="task-list" class="task-list" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <!-- Add / Edit Task Modal -->
  <div id="task-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button type="button" class="icon-btn" id="close-modal-btn" aria-label="Close modal">&times;</button>
      </div>

      <form id="task-form" class="modal-form">
        <input type="hidden" id="task-id" />

        <div class="form-group">
          <label for="task-title">Task title *</label>
          <input id="task-title" type="text" required maxlength="150" placeholder="e.g., Prepare project presentation" />
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" rows="3" placeholder="Add task notes or details..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-due">Due date *</label>
            <input id="task-due" type="date" required />
          </div>

          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="Pending" selected>Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancel-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-task-btn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
